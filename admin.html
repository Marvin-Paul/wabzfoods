<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wabz Foods | Admin Dashboard</title>
    <meta http-equiv="refresh" content="0; url=/admin">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/logo/wabzfoodz-favicon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/images/logo/wabzfoodz-icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #171717;
        }
        .redirect-card {
            text-align: center;
            max-width: 420px;
            padding: 40px;
        }
        .redirect-card .admin-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            color: #3ecf8e;
            background: rgba(62, 207, 142, 0.1);
            padding: 2px 8px;
            border-radius: 9999px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .redirect-card img { height: 50px; margin-bottom: 12px; }
        .redirect-card h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .redirect-card p { color: #707070; margin-bottom: 24px; }
        .redirect-card a {
            display: inline-block;
            padding: 12px 24px;
            background: #3ecf8e;
            color: #171717;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.15s;
        }
        .redirect-card a:hover { background: #24b47e; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #dfdfdf;
            border-top-color: #3ecf8e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner"></div>
        <img src="assets/images/logo/wabzfoodz-logo-sm.png" alt="Wabz Foods">
        <span class="admin-badge">ADMIN</span>
        <h1>Admin Dashboard</h1>
        <p>Redirecting to the new admin panel...</p>
        <a href="/admin">Enter Admin</a>
    </div>
</body>
</html>
